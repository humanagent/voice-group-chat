<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101116">
    <title>The room · Offline</title>
    <link rel="icon" href="/icons/room-192.png">
    <link rel="stylesheet" href="/offline.css">
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icons/room-192.png" alt="" width="80" height="80">
      <h1>You’re offline.</h1>
      <label for="draft">Your next message</label>
      <textarea id="draft" rows="4" maxlength="20000" placeholder="Loading…" disabled></textarea>
      <p id="status" role="status">Drafts stay on this device. Messages need a connection.</p>
      <a href="/">Back to the room <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
